<script>


/*
========================================================
NORMAL LOGIN
========================================================
*/

function login() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    if (!email || !password) {

        alert("SYSTEM: Missing credentials");

        return;

    }


    auth.signInWithEmailAndPassword(
        email,
        password
    )

    .then(function(userCredential) {

        const user = userCredential.user;


        console.log("EMAIL LOGIN SUCCESS");

        console.log("UID:", user.uid);


        alert(
            "ENTER SYSTEM: " +
            user.email
        );


        window.location.href =
            "home.html";

    })

    .catch(function(error) {

        console.error(
            "EMAIL LOGIN ERROR:",
            error.code,
            error.message
        );


        if (error.code === "auth/user-not-found") {

            alert(
                "NO ACCOUNT FOUND.\n\n" +
                "Please use AWAKEN ACCOUNT first."
            );

        }

        else if (error.code === "auth/wrong-password") {

            alert(
                "ACCESS DENIED:\n\n" +
                "Incorrect password."
            );

        }

        else if (error.code === "auth/invalid-credential") {

            alert(
                "LOGIN FAILED:\n\n" +
                "The email/password credentials are incorrect."
            );

        }

        else {

            alert(
                "LOGIN FAILED:\n\n" +
                error.message
            );

        }

    });

}



/*
========================================================
SIGN UP
========================================================
*/

function signup() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    if (!email || !password) {

        alert("SYSTEM: Missing credentials");

        return;

    }


    if (password.length < 6) {

        alert(
            "ACCESS KEY must contain at least 6 characters."
        );

        return;

    }


    auth.createUserWithEmailAndPassword(
        email,
        password
    )

    .then(function(userCredential) {

        const user =
            userCredential.user;


        console.log("ACCOUNT CREATED");

        console.log("UID:", user.uid);


        alert(
            "AWAKEN COMPLETE: " +
            user.email
        );


        window.location.href =
            "home.html";

    })

    .catch(function(error) {

        console.error(
            "SIGNUP ERROR:",
            error.code,
            error.message
        );


        if (
            error.code ===
            "auth/email-already-in-use"
        ) {

            alert(
                "ACCOUNT ALREADY EXISTS.\n\n" +
                "Please use ENTER SYSTEM to login."
            );

        }

        else {

            alert(
                "ACCOUNT CREATION FAILED:\n\n" +
                error.message
            );

        }

    });

}



/*
========================================================
GOOGLE LOGIN
========================================================
*/

function googleLogin() {

    const provider =
        new firebase.auth.GoogleAuthProvider();


    /*
    Ask Google for the user's email.
    */

    provider.setCustomParameters({

        prompt: "select_account"

    });


    auth.signInWithPopup(provider)

    .then(function(result) {

        const user =
            result.user;


        console.log(
            "GOOGLE LOGIN SUCCESS"
        );


        console.log(
            "Google Email:",
            user.email
        );


        console.log(
            "Firebase UID:",
            user.uid
        );


        console.log(
            "Providers:",
            user.providerData.map(
                function(provider) {

                    return provider.providerId;

                }
            )
        );


        alert(
            "GOOGLE ACCESS GRANTED:\n\n" +
            user.email
        );


        window.location.href =
            "home.html";

    })

    .catch(function(error) {

        console.error(
            "GOOGLE LOGIN ERROR:",
            error.code,
            error.message
        );


        /*
        ====================================================
        IMPORTANT CASE
        ====================================================

        The email already exists with another provider.

        Example:

        Email/Password account
                    +
        Google login

        Firebase stops the Google login because the
        providers have not yet been linked.
        ====================================================
        */

        if (
            error.code ===
            "auth/account-exists-with-different-credential"
        ) {

            const email =
                error.customData.email;


            alert(
                "ACCOUNT ALREADY EXISTS\n\n" +

                email +

                "\n\n" +

                "This account was created using " +

                "Email + Password.\n\n" +

                "Please login using your password first, " +

                "then link Google to this account."
            );


            /*
            Store the Google credential temporarily.

            This is only kept in memory for the current
            page session.
            */

            window.pendingGoogleCredential =
                error.credential;

            window.pendingGoogleEmail =
                email;


            /*
            Show the LINK GOOGLE button.
            */

            showLinkGoogleButton();


        }

        else if (
            error.code ===
            "auth/popup-closed-by-user"
        ) {

            alert(
                "GOOGLE LOGIN CANCELLED."
            );

        }

        else {

            alert(
                "GOOGLE LOGIN FAILED:\n\n" +
                error.message
            );

        }

    });

}



/*
========================================================
SHOW LINK GOOGLE BUTTON
========================================================
*/

function showLinkGoogleButton() {

    if (
        document.getElementById(
            "linkGoogleButton"
        )
    ) {

        return;

    }


    const button =
        document.createElement("button");


    button.id =
        "linkGoogleButton";


    button.className =
        "btn google";


    button.innerText =
        "LINK GOOGLE ACCOUNT";


    button.onclick =
        linkGoogleAccount;


    document
        .querySelector(".container")
        .appendChild(button);

}



/*
========================================================
LINK GOOGLE TO EXISTING EMAIL/PASSWORD ACCOUNT
========================================================

IMPORTANT:

The user must first login using their existing
Email + Password.

Then this function links Google to that SAME Firebase
user account.

After linking:

Email/Password ───┐
                  │
                  ├── SAME Firebase UID
                  │
Google ───────────┘

Purchases remain attached to that UID.
========================================================
*/

function linkGoogleAccount() {

    const currentUser =
        auth.currentUser;


    if (!currentUser) {

        alert(
            "SYSTEM: Please login with your email and password first."
        );

        return;

    }


    if (
        !window.pendingGoogleCredential
    ) {

        alert(
            "No Google authentication request is waiting."
        );

        return;

    }


    currentUser
        .linkWithCredential(
            window.pendingGoogleCredential
        )

        .then(function(result) {

            console.log(
                "GOOGLE SUCCESSFULLY LINKED"
            );


            console.log(
                "Firebase UID:",
                result.user.uid
            );


            alert(
                "GOOGLE ACCOUNT LINKED SUCCESSFULLY!\n\n" +

                "You can now use either:\n\n" +

                "• Gmail + Password\n" +

                "• Sign in with Google\n\n" +

                "Both will access the SAME account and purchases."
            );


            window.pendingGoogleCredential =
                null;


            window.pendingGoogleEmail =
                null;


            window.location.href =
                "home.html";

        })

        .catch(function(error) {

            console.error(
                "LINK GOOGLE ERROR:",
                error.code,
                error.message
            );


            if (
                error.code ===
                "auth/credential-already-in-use"
            ) {

                alert(
                    "This Google account is already connected to another Firebase account."
                );

            }

            else if (
                error.code ===
                "auth/provider-already-linked"
            ) {

                alert(
                    "Google is already linked to this account."
                );

            }

            else {

                alert(
                    "GOOGLE LINK FAILED:\n\n" +
                    error.message
                );

            }

        });

}


</script>
