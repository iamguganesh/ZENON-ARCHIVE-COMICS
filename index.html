<style>
:root {
  --ink: #111; --paper: #fffdf2; --red: #ff2e3b; --blue: #1f7bff; --yellow: #ffe600;
  --rx: 0deg; --ry: 0deg; --px: 0; --py: 0;
  --head: Impact, Haettenschweiler, "Arial Narrow Bold", "Arial Black", sans-serif;
  --hand: "Comic Sans MS", "Chalkboard SE", "Segoe Print", "Marker Felt", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--ink); }
body { min-height: 100vh; min-height: 100dvh; font-family: var(--hand); color: var(--ink); overflow-x: hidden; }

/* ---------- BACKDROP: art + halftone + speed lines (all CSS, no extra files) ---------- */
.bg { position: fixed; inset: -3%; z-index: -4; transform: translate3d(calc(var(--px) * -10px), calc(var(--py) * -8px), 0); }
.bg img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(.35) contrast(1.25) brightness(.62); }
.tone { position: fixed; inset: 0; z-index: -3; pointer-events: none; mix-blend-mode: multiply; }
.tone.r { background: radial-gradient(circle, var(--red) 28%, transparent 30%) 0 0/9px 9px;
          -webkit-mask-image: linear-gradient(100deg, #000, transparent 55%); mask-image: linear-gradient(100deg, #000, transparent 55%); opacity: .75; }
.tone.b { background: radial-gradient(circle, var(--blue) 28%, transparent 30%) 4px 4px/9px 9px;
          -webkit-mask-image: linear-gradient(260deg, #000, transparent 55%); mask-image: linear-gradient(260deg, #000, transparent 55%); opacity: .8; }
.rays { position: fixed; left: 50%; top: 50%; width: 220vmax; height: 220vmax; margin: -110vmax 0 0 -110vmax; z-index: -2; pointer-events: none;
  background: repeating-conic-gradient(rgba(255,255,255,.16) 0 2deg, transparent 2deg 7deg);
  -webkit-mask-image: radial-gradient(circle, transparent 7%, #000 30%); mask-image: radial-gradient(circle, transparent 7%, #000 30%);
  animation: spin 90s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.vig { position: fixed; inset: 0; z-index: -1; pointer-events: none; box-shadow: inset 0 0 120px 20px rgba(0,0,0,.75); }

/* ---------- STAGE ---------- */
.stage { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 22px; padding: 22px 14px 30px; perspective: 1000px; position: relative; }

/* Title: stroked, offset-shadow comic lettering */
.site-title { margin: 0; text-align: center; font: 400 clamp(40px, 10vw, 92px)/.92 var(--head); letter-spacing: .03em;
  color: var(--yellow); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill;
  text-shadow: 5px 5px 0 var(--ink), 9px 9px 0 var(--red);
  transform: rotate(-2deg) translate3d(calc(var(--px) * 8px), calc(var(--py) * 5px), 0);
  animation: pop .6s cubic-bezier(.2,1.6,.4,1) both; }
.site-title small { display: inline-block; margin-top: 12px; padding: 4px 14px; font-size: .26em; letter-spacing: .35em;
  color: #fff; background: var(--blue); -webkit-text-stroke: 0; border: 3px solid var(--ink); text-shadow: none;
  box-shadow: 4px 4px 0 var(--ink); transform: rotate(2deg); }
@keyframes pop { from { opacity: 0; transform: scale(.5) rotate(-8deg); } }

/* Speech bubble */
.bubble { position: relative; max-width: 300px; padding: 10px 16px; background: #fff; border: 3px solid var(--ink); border-radius: 22px;
  font-size: 15px; font-weight: 700; text-align: center; box-shadow: 4px 4px 0 var(--ink);
  transform: rotate(-1.5deg); animation: pop .6s .25s cubic-bezier(.2,1.6,.4,1) both; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -20px; margin-left: -10px; width: 22px; height: 22px; background: #fff;
  border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: skewY(40deg) rotate(8deg); border-radius: 0 0 8px 0; }
.bubble.swap { animation: pop .35s cubic-bezier(.2,1.6,.4,1) both; }

/* ---------- PANEL CARD ---------- */
.card { position: relative; width: min(390px, 100%); margin-top: 8px; padding: 70px 24px 24px; text-align: center;
  background: var(--paper); border: 5px solid var(--ink); border-radius: 6px; box-shadow: 10px 10px 0 var(--ink), 10px 10px 0 5px var(--yellow);
  background-image: radial-gradient(circle, rgba(31,123,255,.18) 1.4px, transparent 1.8px); background-size: 8px 8px;
  transform-style: preserve-3d; transform: rotateX(var(--rx)) rotateY(var(--ry)) rotate(.8deg); transition: transform .12s ease-out;
  animation: pop .6s .1s cubic-bezier(.2,1.6,.4,1) both, glow 3.5s 1s ease-in-out infinite; }
.fx { position: absolute; font: 400 26px var(--head); color: var(--red); -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill;
  text-shadow: 2px 2px 0 var(--ink); pointer-events: none; z-index: 2; }
.fx.a { top: -18px; right: -14px; transform: rotate(14deg); }
.fx.b { bottom: -20px; left: -12px; color: var(--blue); transform: rotate(-10deg); }

.logo-wrap { position: absolute; top: -46px; left: 50%; width: 92px; height: 92px; margin-left: -46px; transform: translateZ(60px); }
.logo { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 5px solid var(--ink); background: #fff;
        box-shadow: 4px 4px 0 var(--ink), 0 0 0 5px var(--yellow); }

label { display: block; margin: 12px 0 4px; text-align: left; font: 400 17px var(--head); letter-spacing: .08em; transform: translateZ(20px); }
input { width: 100%; padding: 11px 12px; background: #fff; color: var(--ink); border: 3px solid var(--ink); border-radius: 4px;
  font: 700 16px var(--hand); outline: none; box-shadow: 3px 3px 0 var(--ink); transition: transform .12s, box-shadow .12s, background .12s; }
input::placeholder { color: #8a8a8a; font-weight: 400; }
input:focus { background: #fffbd0; transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--blue); }

.btn { display: block; width: 100%; margin: 14px 0 0; padding: 12px; cursor: pointer; border: 3px solid var(--ink); border-radius: 4px;
  font: 400 21px var(--head); letter-spacing: .08em; color: var(--ink); box-shadow: 5px 5px 0 var(--ink);
  transition: transform .1s, box-shadow .1s; }
.btn:hover { transform: translate(-2px, -2px) rotate(-.6deg); box-shadow: 7px 7px 0 var(--ink); }
.btn:active { transform: translate(4px, 4px); box-shadow: 1px 1px 0 var(--ink); }
.btn:focus-visible, input:focus-visible { outline: 3px dashed var(--red); outline-offset: 3px; }
.signin { background: var(--yellow); }
.signup { background: var(--red); color: #fff; text-shadow: 2px 2px 0 var(--ink); }
.google { background: #fff; font: 700 15px var(--hand); letter-spacing: 0; }
.or { margin: 14px 0 0; font: 400 15px var(--head); letter-spacing: .3em; }

#passwordSetup { display: none; }
.setup-title { font: 400 24px var(--head); letter-spacing: .08em; margin-bottom: 4px; }

/* WOW: comic burst intro, once per visit */
.intro { --burst: polygon(50% 0, 61% 14%, 79% 8%, 82% 27%, 100% 33%, 90% 50%, 100% 67%, 82% 73%, 79% 92%, 61% 86%, 50% 100%, 39% 86%, 21% 92%, 18% 73%, 0 67%, 10% 50%, 0 33%, 18% 27%, 21% 8%, 39% 14%);
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--ink); pointer-events: none; animation: introOut 1.6s forwards; }
.intro::before { content: ""; position: absolute; inset: 0; margin: auto; width: min(138vmin, 860px); aspect-ratio: 1; background: var(--red);
  clip-path: var(--burst); animation: slam 1.6s .05s cubic-bezier(.2,1.4,.4,1) forwards; }
.intro b { width: min(112vmin, 700px); aspect-ratio: 1; display: grid; place-items: center; background: var(--yellow); clip-path: var(--burst);
  font: 400 clamp(44px, 13vmin, 110px) var(--head); letter-spacing: .04em; color: var(--red); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill;
  text-shadow: 5px 5px 0 var(--ink); animation: slam 1.6s cubic-bezier(.2,1.4,.4,1) forwards; }
@keyframes slam { 0% { opacity: 0; transform: scale(.2) rotate(-25deg); } 22% { opacity: 1; transform: scale(1.12) rotate(4deg); } 32% { transform: scale(1) rotate(-2deg); } 78% { opacity: 1; transform: scale(1.03) rotate(-2deg); } 100% { opacity: 0; transform: scale(1.5) rotate(4deg); } }
@keyframes introOut { 0%, 72% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
/* colour-pulsing glow on the card and logo */
@keyframes glow { 0%, 100% { box-shadow: 10px 10px 0 var(--ink), 10px 10px 0 5px var(--yellow), 0 0 34px 8px rgba(255,46,59,.55); }
                  50% { box-shadow: 10px 10px 0 var(--ink), 10px 10px 0 5px var(--yellow), 0 0 34px 8px rgba(31,123,255,.6); } }
@keyframes bob { 50% { transform: translateY(-5px) scale(1.04); } }
.logo { animation: bob 3s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .intro { display: none; } }

@media (max-width: 480px) { .card { padding: 66px 16px 20px; } .fx { font-size: 21px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .card { transform: none; } }
</style>
</head>

<script>
/* ======== AUTH (same behaviour as your original) ======== */
function val(id, trim) { var v = document.getElementById(id).value; return trim ? v.trim() : v; }
function goHome() { window.location.href = "home.html"; }

function login() {
    var email = val("email", true), password = val("password");
    if (!email || !password) { alert("SYSTEM: Missing credentials"); return; }
    auth.signInWithEmailAndPassword(email, password)
    .then(function (c) { alert("ENTER SYSTEM: " + c.user.email); goHome(); })
    .catch(function (error) {
        console.error(error.code, error.message);
        if (error.code === "auth/invalid-credential") alert("ACCESS DENIED.\n\nIncorrect Gmail or Access Key.");
        else if (error.code === "auth/user-not-found") alert("NO ACCOUNT FOUND.\n\nUse AWAKEN ACCOUNT first.");
        else alert("LOGIN FAILED:\n\n" + error.message);
    });
}

function signup() {
    var email = val("email", true), password = val("password");
    if (!email || !password) { alert("SYSTEM: Missing credentials"); return; }
    if (password.length < 6) { alert("ACCESS KEY must contain at least 6 characters."); return; }
    auth.createUserWithEmailAndPassword(email, password)
    .then(function (c) { alert("AWAKEN COMPLETE: " + c.user.email); goHome(); })
    .catch(function (error) {
        console.error(error.code, error.message);
        if (error.code === "auth/email-already-in-use") alert("ACCOUNT ALREADY EXISTS.\n\nPlease use ENTER SYSTEM or CONTINUE WITH GOOGLE.");
        else alert("ACCOUNT CREATION FAILED:\n\n" + error.message);
    });
}

function googleLogin() {
    var provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    auth.signInWithPopup(provider)
    .then(function (result) {
        var user = result.user;
        var hasPassword = user.providerData.some(function (p) { return p.providerId === "password"; });
        if (!hasPassword) {
            document.getElementById("normalLogin").style.display = "none";
            document.getElementById("passwordSetup").style.display = "block";
            say("One last step: forge your access key!");
            alert("GOOGLE ACCESS GRANTED.\n\nCreate an Access Key once so you can also login with Gmail + Password.");
            return;
        }
        alert("GOOGLE ACCESS GRANTED:\n\n" + user.email);
        goHome();
    })
    .catch(function (error) {
        console.error("GOOGLE LOGIN ERROR:", error.code, error.message);
        if (error.code === "auth/account-exists-with-different-credential") alert("THIS GMAIL ALREADY HAS A PASSWORD ACCOUNT.\n\nPlease login using Gmail + Password first.");
        else if (error.code === "auth/popup-closed-by-user") alert("GOOGLE LOGIN CANCELLED.");
        else alert("GOOGLE LOGIN FAILED:\n\n" + error.message);
    });
}

/* Link Email/Password to the CURRENT Google user (same UID, no new account) */
function setPassword() {
    var p1 = val("newPassword"), p2 = val("confirmPassword");
    if (!p1 || !p2) { alert("SYSTEM: Enter the Access Key twice."); return; }
    if (p1.length < 6) { alert("ACCESS KEY must contain at least 6 characters."); return; }
    if (p1 !== p2) { alert("ACCESS KEYS DO NOT MATCH."); return; }
    var user = auth.currentUser;
    if (!user) { alert("SESSION EXPIRED.\n\nPlease sign in with Google again."); return; }
    user.linkWithCredential(firebase.auth.EmailAuthProvider.credential(user.email, p1))
    .then(function () {
        alert("ACCOUNT UPDATED SUCCESSFULLY!\n\nYou can now use either:\n\nGOOGLE LOGIN\nor\nGMAIL + PASSWORD\n\nBoth use the SAME account.");
        goHome();
    })
    .catch(function (error) {
        console.error("PASSWORD LINK ERROR:", error.code, error.message);
        if (error.code === "auth/provider-already-linked") alert("PASSWORD LOGIN IS ALREADY LINKED.");
        else if (error.code === "auth/credential-already-in-use") alert("THIS EMAIL/PASSWORD CREDENTIAL IS ALREADY USED BY ANOTHER ACCOUNT.");
        else alert("PASSWORD LINK FAILED:\n\n" + error.message);
    });
}

["email", "password"].forEach(function (id) {
    document.getElementById(id).addEventListener("keydown", function (e) { if (e.key === "Enter") login(); });
});
["newPassword", "confirmPassword"].forEach(function (id) {
    document.getElementById(id).addEventListener("keydown", function (e) { if (e.key === "Enter") setPassword(); });
});
</script>

<script>
/* ======== COMIC EFFECTS (about 1 KB, no downloads) ======== */
var bubble = document.getElementById("bubble");
function say(text) {
    if (bubble.textContent === text) return;
    bubble.textContent = text;
    bubble.classList.remove("swap"); void bubble.offsetWidth; bubble.classList.add("swap");
}
document.querySelectorAll("[data-say]").forEach(function (el) {
    var t = el.getAttribute("data-say");
    el.addEventListener("focus", function () { say(t); });
    el.addEventListener("mouseenter", function () { say(t); });
});

(function () {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var root = document.documentElement, queued = false, x = 0, y = 0;
    function apply() {
        queued = false;
        root.style.setProperty("--ry", (x * 6).toFixed(2) + "deg");
        root.style.setProperty("--rx", (-y * 6).toFixed(2) + "deg");
        root.style.setProperty("--px", x.toFixed(3));
        root.style.setProperty("--py", y.toFixed(3));
    }
    function move(a, b) {
        x = Math.max(-1, Math.min(1, a)); y = Math.max(-1, Math.min(1, b));
        if (!queued) { queued = true; requestAnimationFrame(apply); }
    }
    window.addEventListener("pointermove", function (e) { move((e.clientX / innerWidth - .5) * 2, (e.clientY / innerHeight - .5) * 2); }, { passive: true });
    window.addEventListener("deviceorientation", function (e) { if (e.gamma != null) move(e.gamma / 30, (e.beta - 45) / 30); }, { passive: true });
})();
</script>
