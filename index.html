body {

body::before {

    position: fixed;
    top: 0;
    left: 0;

    height: 100%;
    z-index: 0;
    pointer-events: none;

    background: linear-gradient(to right,

body::after {
    content: "";

    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 40%;
    height: 100%;
    z-index: 1;
    pointer-events: none;

        rgba(255,255,255,0.06),

@keyframes pulseHeat {

        opacity: 0.4;
        transform: translateX(-50%) scale(1);
    }
    50% {
        opacity: 0.7;
        transform: translateX(-50%) scale(1.05);

     animation: titlePulse 3s infinite ease-in-out;

@keyframes titlePulse {
    0% { opacity: 0.6; transform: translateX(-50%) scale(1); }
    50% { opacity: 1; transform: translateX(-50%) scale(1.03); }
    100% { opacity: 0.6; transform: translateX(-50%) scale(1); }

<!-- LOGIN BOX BOTTOM CENTER -->
<div class="container">



    <input type="text" id="email" placeholder="User ID / Gmail">
<input type="password" id="password" placeholder="Access Key">

    <button class="btn signin" onclick="login()">ENTER SYSTEM</button>
    <button class="btn signup" onclick="signup()">AWAKEN ACCOUNT</button>

</div>
<script>
function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (!email || !password) {
        alert("SYSTEM: Missing credentials");
        return;
    }

    auth.signInWithEmailAndPassword(email, password)
    .then((userCredential) => {
        alert("ENTER SYSTEM: " + userCredential.user.email);
        window.location.href = "home.html";
    })
    .catch((error) => {
        alert(error.message);
    });
}

function signup() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (!email || !password) {
        alert("SYSTEM: Missing credentials");
        return;
    }

    auth.createUserWithEmailAndPassword(email, password)
    .then((userCredential) => {
        alert("AWAKEN COMPLETE: " + userCredential.user.email);
        window.location.href = "home.html";
    })
    .catch((error) => {

        if (error.code === "auth/email-already-in-use") {
            // auto login instead
            auth.signInWithEmailAndPassword(email, password)
            .then((user) => {
                alert("WELCOME BACK: " + user.user.email);
            })
            .catch((err) => {
                alert("LOGIN FAILED: " + err.message);
            });

        } else {
            alert(error.message);
        }
    });
}
</script>
