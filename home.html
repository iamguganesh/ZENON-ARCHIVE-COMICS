<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ZENON ARCHIVE: Comics | Sci-Fi Comic Universe by K.G.ZENON</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>
body{
    background:#05060a;
    color:cyan;
    font-family:monospace;
    margin:0;
    padding:30px;
}
.title{
    text-align:center;
    font-size:28px;
    color:gold;
    margin-bottom:10px;
}

.note{
    text-align:center;
    font-size:12px;
    color:#888;
    margin-bottom:30px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:#111;
    padding:20px;
    border-radius:12px;
    border:1px solid rgba(0,255,255,.3);
    text-align:center;
}

.cover{
    width:100%;
    aspect-ratio:2/3;
    object-fit:cover;
    background:#222;
    border-radius:10px;
    display:block;
    margin-bottom:12px;
}

.chapter-title{
    color:rgb(244, 208, 7);
    font-family:'Orbitron', sans-serif;
    font-size:18px;
    font-weight:100;
    margin-bottom:12px;
}

.chapter{
    font-size:18px;
    margin-bottom:10px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    margin-top:10px;
    cursor:pointer;
}

.read{
    background:lime;
}

.locked{
    background:#333;
    color:#888;
}

.buy{
    background:#00ff88;
    color:black;
    font-weight:bold;
    transition:0.3s;
}

.buy:hover{
    background:#00e67a;
    transform:scale(1.03);
}

</style>

</head>

<body>

<div class="title">ZENON ARCHIVE</div>

<div class="note">
⚠️ comic visuals are AI-generated for concept/story presentation
</div>

<div class="grid">

<!-- CHAPTER 1 -->
<div class="card">

    <div class="chapter-title">Before the Rise</div>

    <img src="comiccover.webp" class="cover">

    <div class="chapter">Chapter 1</div>


    <button class="read" onclick="openComic('chapter1.html')">
        READ NOW
    </button>

</div>

<!-- CHAPTER 2 -->
<div class="card">

<div class="chapter-title">After Kiraxians Born</div>
    <img src="comiccover.webp" class="cover">
    <div class="chapter">Chapter 2</div>

    <button id="buyBtn2" class="buy" onclick="buyChapter2()">
    BUY ₹30
</button>

    <button id="readBtn2" class="read"
            onclick="openComic('chapter2.html')"
            style="display:none;">
        READ NOW
    </button>
</div>

<!-- CHAPTER 3 -->
<div class="card">
    <div class="chapter-title">The Mysterious light</div>
    <img src="comiccover.webp" class="cover">
    <div class="chapter">Chapter 3</div>

    <button class="read" onclick="openComic('chapter3.html')">
        READ NOW
    </button>
</div>

</div>

<!-- Razorpay still kept for future -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCAsCLLdubOu2sa1tcGDWinGZvHcxPS3yM",
  authDomain: "zenon-archive.firebaseapp.com",
  projectId: "zenon-archive",
  storageBucket: "zenon-archive.firebasestorage.app",
  messagingSenderId: "168695503958",
  appId: "1:168695503958:web:f347fb1b73993e78fd6ff7",
  measurementId: "G-5412M1HM6T"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
</script>


<script>

function openComic(page){
    window.location.href = page;
}

// Check if Chapter 2 is already unlocked
window.onload = function(){

    auth.onAuthStateChanged(async(user)=>{

        if(!user) return;

        const doc = await db.collection("users").doc(user.uid).get();

        if(doc.exists && doc.data().chapter2){

            document.getElementById("buyBtn2").style.display="none";
            document.getElementById("readBtn2").style.display="block";

        }

    });

}

async function buyChapter2() {

    const user = auth.currentUser;

    if (!user) {
        alert("Please login first.");
        return;
    }

    // Create order from backend
   let order;

try {

    const response = await fetch(
        "https://zenon-archive-backend.onrender.com/create-order",
        {
            method: "POST"
        }
    );

    order = await response.json();

} catch (e) {

    console.error(e);
    alert("Cannot connect to payment server.");
    return;

}

if (!order.id) {

    alert("Unable to create payment order.");
    return;

}

    var options = {

        key: "rzp_live_T7rSUWNuRqdAll",

        amount: order.amount,

        currency: order.currency,

        order_id: order.id,

        name: "ZENON ARCHIVE",

        description: "Unlock Chapter 2",

        handler: async function(response){

            const verify = await fetch("https://zenon-archive-backend.onrender.com/verify-payment",{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    razorpay_order_id:response.razorpay_order_id,

                    razorpay_payment_id:response.razorpay_payment_id,

                    razorpay_signature:response.razorpay_signature,

                    uid:user.uid

                })

            });

            const result = await verify.json();

            if(result.success){

                document.getElementById("buyBtn2").style.display="none";
                document.getElementById("readBtn2").style.display="block";

                window.location.href="chapter2.html";

            }else{

                alert(result.message);

            }

        }

    };

    var rzp = new Razorpay(options);

    rzp.open();

}

</script>

</body>
</html>
